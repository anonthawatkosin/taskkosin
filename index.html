<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="task-kosin-32.png">
<link rel="apple-touch-icon" href="task-kosin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Task Kosin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0122E">
<title>Task Kosin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: Glass — frosted cards over a living backdrop (drifting red light, particle network, floating task icons). Hero with greeting + progress ring, sliding filters, card list, floating glass dock. */
:root{
  --bg:#FFF8F8; --surface:#FFFFFF; --soft:#F6EEF0; --fg:#1B1214; --muted:#86757A; --line:#EEE2E4;
  --red:#E0122E; --red-2:#FF5A6E; --red-soft:#FDEBEE; --on-red:#FFFFFF;
  --amber:#D27600; --amber-soft:#FFF2DF; --green:#158F57; --green-soft:#E2F5EB;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.8); --glass-line:rgba(255,255,255,.95);
  --shadow:0 14px 34px -16px rgba(160,10,30,.3);
  --particle:224,18,46;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0A0C; --surface:#1B1417; --soft:#221A1D; --fg:#F7EEF0; --muted:#A8969B; --line:#30252A;
  --red:#FF2F4C; --red-2:#FF7A8B; --red-soft:#3B141B; --on-red:#FFFFFF;
  --amber:#FFA93A; --amber-soft:#382510; --green:#3ED08C; --green-soft:#0F2D20;
  --glass:rgba(32,20,25,.55); --glass-strong:rgba(32,20,25,.85); --glass-line:rgba(255,255,255,.08);
  --shadow:0 14px 34px -16px rgba(0,0,0,.8); --particle:255,90,110; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0A0C; --surface:#1B1417; --soft:#221A1D; --fg:#F7EEF0; --muted:#A8969B; --line:#30252A;
  --red:#FF2F4C; --red-2:#FF7A8B; --red-soft:#3B141B; --on-red:#FFFFFF;
  --amber:#FFA93A; --amber-soft:#382510; --green:#3ED08C; --green-soft:#0F2D20;
  --glass:rgba(32,20,25,.55); --glass-strong:rgba(32,20,25,.85); --glass-line:rgba(255,255,255,.08);
  --shadow:0 14px 34px -16px rgba(0,0,0,.8); --particle:255,90,110; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.app{max-width:600px;margin:0 auto;padding:18px 16px 130px;position:relative;z-index:2}

/* ================= LIVING BACKDROP ================= */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(64px)}
.blob.b1{width:420px;height:420px;background:var(--red);opacity:.42;top:-160px;right:-140px;animation:f1 16s ease-in-out infinite}
.blob.b2{width:320px;height:320px;background:var(--red-2);opacity:.3;top:38%;left:-170px;animation:f2 21s ease-in-out infinite}
.blob.b3{width:280px;height:280px;background:var(--red);opacity:.2;bottom:-120px;right:8%;animation:f1 26s ease-in-out infinite reverse}
@keyframes f1{33%{transform:translate(-70px,60px) scale(1.15)}66%{transform:translate(30px,-30px) scale(.92)}}
@keyframes f2{50%{transform:translate(80px,-50px) scale(.88)}}
#net{position:absolute;inset:0;width:100%;height:100%}
.floaty{position:absolute;color:var(--red);opacity:.16;animation:drift var(--d,18s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.floaty svg{width:100%;height:100%;animation:spinSlow var(--r,30s) linear infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(18px,-26px)}50%{transform:translate(-12px,-48px)}75%{transform:translate(-22px,-18px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(var(--particle),.08) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(transparent,#000 40%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 40%,transparent)}

/* ================= GLASS ================= */
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shadow)}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--red-2));display:grid;place-items:center;position:relative;box-shadow:0 8px 18px -6px var(--red);animation:logoBob 4s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:1.5px solid var(--red);opacity:0;animation:logoPing 4s ease-out infinite}
.logo svg{width:19px;height:19px;color:#fff}
.logo path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 4s ease-in-out infinite}
@keyframes draw{10%,70%{stroke-dashoffset:0}90%,100%{stroke-dashoffset:-24}}
@keyframes logoBob{50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes logoPing{0%,30%{opacity:0;transform:scale(.9)}40%{opacity:.6}70%,100%{opacity:0;transform:scale(1.35)}}
.date{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}

/* Hero */
.hero{margin-top:18px;border-radius:28px;padding:20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);transform:translateX(-100%);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
.greet{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);position:relative}
.greet .sky{width:34px;height:34px;flex:none}
.sun-rays{transform-origin:16px 16px;animation:spinSlow 14s linear infinite}
.moon{animation:moonTilt 5s ease-in-out infinite;transform-origin:16px 16px}
@keyframes moonTilt{50%{transform:rotate(-14deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
.twinkle:nth-of-type(2){animation-delay:1.1s}
@keyframes tw{50%{opacity:.15}}
.hero-main{display:flex;align-items:center;gap:20px;margin-top:14px;position:relative}
.ring{width:112px;height:112px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .trk{stroke:var(--red-soft)}
.ring .val{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(var(--particle),.55))}
.ring .orbit{transform-origin:56px 56px;animation:spinSlow 6s linear infinite}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--f-display);font-size:28px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.ring .lbl small{font-size:11px;color:var(--muted)}
.hero h1{font-family:var(--f-display);font-size:22px;margin:0 0 6px;line-height:1.25;text-wrap:balance}
.hero-stats{display:flex;flex-wrap:wrap;gap:6px}
.hstat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--glass-strong)}
.hstat.red{color:var(--red)}
.hstat svg{width:13px;height:13px}
.hstat .flame{animation:flicker 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flicker{25%{transform:scaleY(1.12) rotate(-4deg)}75%{transform:scaleY(.92) rotate(3deg)}}
.hstat .bell{animation:ring2 2.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring2{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(16deg)}72%{transform:rotate(-14deg)}79%{transform:rotate(9deg)}86%{transform:rotate(-5deg)}}

/* Filters */
.filters{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 0 4px;border-radius:16px;padding:4px}
.filters .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:12px;background:var(--fg);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.filters button{position:relative;z-index:1;border:0;background:none;padding:8px 2px;font-size:12.5px;font-weight:500;color:var(--muted);transition:color .3s;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.filters button b{font-family:var(--f-display);font-size:16px;color:var(--fg);transition:color .3s}
.filters button.on,.filters button.on b{color:var(--bg)}

/* Search */
.search{position:relative;margin:12px 0 4px}
.search input{width:100%;border-radius:14px;padding:11px 14px 11px 40px;outline:none;font-size:14px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:box-shadow .25s}
.search input:focus{box-shadow:0 0 0 3px rgba(var(--particle),.25)}
.search svg{position:absolute;left:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.search input:focus + svg circle{animation:lens .8s ease-in-out infinite alternate}
@keyframes lens{to{r:5}}

/* Cards */
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{border-radius:20px;padding:14px 12px 14px 14px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;animation:cardIn .55s cubic-bezier(.2,.9,.25,1.15) both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(4px)}}
.card .ico{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--glass-strong)}
.card .ico svg{width:20px;height:20px}
.card[data-s="todo"] .ico{color:var(--muted)}
.card[data-s="doing"] .ico{color:var(--amber);background:var(--amber-soft)}
.card[data-s="done"] .ico{color:var(--green);background:var(--green-soft)}
.card[data-s="doing"] .ico .gear{animation:spinSlow 3s linear infinite;transform-origin:12px 12px}
.card[data-s="todo"] .ico .hand{animation:spinSlow 6s linear infinite;transform-origin:12px 12px}
.card[data-s="done"] .ico path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawOnce .6s .2s ease-out forwards}
@keyframes drawOnce{to{stroke-dashoffset:0}}
.card .body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.card .ttl{display:block;font-weight:500;overflow-wrap:anywhere;transition:color .3s}
.card[data-s="done"] .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--green)}
.card.hi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--red);box-shadow:0 0 10px var(--red);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.card[data-s="doing"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:scan 2.2s linear infinite}
@keyframes scan{from{background-position:-50% 0}to{background-position:150% 0}}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--muted);margin-top:3px}
.urgent{color:var(--red);font-weight:600}
.late{color:var(--red)}
/* 3-state status switch */
.card{align-items:flex-start}
.info{flex:1;min-width:0}
.card .body{width:100%}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--glass-strong);border-radius:11px;padding:3px;margin-top:10px;max-width:330px}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;transition:transform .42s cubic-bezier(.3,1.35,.5,1),background .3s;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.seg[data-s="todo"] .knob{background:var(--muted)}
.seg[data-s="doing"] .knob{transform:translateX(100%);background:var(--amber)}
.seg[data-s="done"] .knob{transform:translateX(200%);background:var(--green)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 2px;font-size:12px;font-weight:500;color:var(--muted);border-radius:8px;transition:color .3s;white-space:nowrap}
.seg button.on{color:#fff;font-weight:600}

.ahead{display:flex;align-items:center;gap:10px;margin-top:10px;border-radius:16px;padding:11px 14px;font-size:13.5px;width:100%;text-align:left}
.ahead svg{width:20px;height:20px;color:var(--red);flex:none}
.ahead b{color:var(--red)}

/* Calendar */
.todayBtn{border-radius:12px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--red)}
.cal{border-radius:26px;padding:16px;margin-top:18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-family:var(--f-display);font-size:20px;margin:0}
.cnav{width:38px;height:38px;border-radius:12px;border:0;background:var(--glass-strong);font-size:20px;line-height:1;transition:transform .2s}
.cnav:active{transform:scale(.88)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dows{margin:14px 0 4px;font-size:11.5px;color:var(--muted);text-align:center}
.dcell{aspect-ratio:1;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .2s;min-width:0}
.dcell:hover{background:var(--glass-strong)}
.dcell:active{transform:scale(.9)}
.dcell.out{opacity:.35}
.dcell.today{color:var(--red);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--red)}
.dcell.sel{background:linear-gradient(135deg,var(--red),var(--red-2));color:#fff;box-shadow:0 8px 16px -8px var(--red);animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.dcell.sel .dots i{background:#fff!important}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.slide-l{animation:slideL .4s ease both}.slide-r{animation:slideR .4s ease both}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.day-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 0;gap:10px}
.day-head h3{font-family:var(--f-display);font-size:17px;margin:0}
.day-head h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.addDay{border:0;border-radius:12px;padding:8px 12px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:13px;white-space:nowrap}

.empty{border-radius:22px;padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty svg{width:64px;height:64px;color:var(--red);display:block;margin:0 auto 8px}
.empty .bob{animation:logoBob 3s ease-in-out infinite;transform-origin:center}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px}

/* confetti */
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:40;animation:spark .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}

/* ================= HISTORY ================= */
.view{display:none}
.view.on{display:block;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.h-hero{border-radius:26px;padding:18px;margin-top:18px}
.h-hero h2{font-family:var(--f-display);font-size:22px;margin:0;display:flex;align-items:center;gap:8px}
.h-hero h2 svg{width:24px;height:24px;color:var(--red)}
.h-hero h2 .hand{animation:spinSlow 4s linear infinite;transform-origin:12px 12px}
.h-sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.chart{display:flex;align-items:flex-end;gap:4px;height:76px;margin:18px 0 6px}
.chart div{flex:1;background:var(--line);border-radius:5px;min-height:4px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1.2) both}
.chart div.has{background:linear-gradient(var(--red-2),var(--red));box-shadow:0 0 12px -2px rgba(var(--particle),.5)}
.chart div.today{animation:grow .8s cubic-bezier(.2,.9,.3,1.2) both,glow 2s 1s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.h-day{margin-top:20px;animation:cardIn .5s both}
.h-day-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;padding:0 4px 8px}
.h-day-head span{font-weight:400;color:var(--muted);font-size:12px}
.h-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;margin-bottom:6px}
.h-row .ok{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.h-row .ok svg{width:12px;height:12px;color:#fff}
.h-row .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.h-row .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--red);font-size:13px;font-weight:600;padding:4px 0}
.clear{display:block;margin:24px auto 0;border-radius:99px;padding:8px 18px;font-size:13px;color:var(--muted)}
.clear.arm{color:var(--red);border-color:var(--red)}

/* ================= DOCK ================= */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:6px;padding:6px;border-radius:26px}
.tab{border:0;background:none;color:var(--muted);padding:7px 10px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;transition:color .3s,background .3s;min-width:58px}
.tab.on .ic-cal .pg{animation:pgBounce .9s ease-in-out infinite}
@keyframes pgBounce{50%{transform:translateY(-1.5px)}}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--red);background:var(--glass-strong)}
.tab.on .ic-list path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawOnce .5s ease-out forwards}
.tab.on .ic-clock .hand{animation:spinSlow 3s linear infinite;transform-origin:12px 12px}
.tab.on svg{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
.add{border:0;width:56px;height:56px;border-radius:20px;position:relative;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--red),var(--red-2));box-shadow:0 10px 24px -8px var(--red);transition:transform .25s}
.add::before{content:"";position:absolute;inset:-3px;border-radius:23px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--red-2) 85%,transparent);z-index:-1;animation:orbit 3s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes orbit{to{--a:360deg}}
.add svg{width:26px;height:26px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.add:hover svg{transform:rotate(90deg)}
.add:active{transform:scale(.9)}

/* ================= SHEET ================= */
.scrim{position:fixed;inset:0;background:rgba(20,6,10,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--glass-strong);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--glass-line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.95,.25,1);z-index:21;max-height:92%;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(var(--particle),.18)}
.field textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:grid;gap:6px}
.choice.c3{grid-template-columns:repeat(3,1fr)}
.choice.c2{grid-template-columns:1fr 1fr}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:13px;transition:all .25s}
.choice button.on{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600;transform:translateY(-1px)}
.err{color:var(--red);font-size:12.5px;margin-top:6px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600}
.btn.primary{flex:1;background:linear-gradient(135deg,var(--red),var(--red-2));color:#fff;box-shadow:0 8px 18px -8px var(--red)}
.btn.ghost{background:var(--soft)}
.btn.danger{background:none;color:var(--red);padding:13px 6px}
.btn:disabled{opacity:.6}
.demo .link{font-size:inherit;padding:0;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.95);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1.4);z-index:30;white-space:nowrap;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{border:0;background:none;color:var(--red-2);font-weight:600;padding:0}
.demo{font-size:11.5px;color:var(--muted);text-align:center;margin-top:26px}

/* sync status */
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;margin-top:5px;padding:2px 9px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync[data-s="saving"] i,.sync[data-s="loading"] i{background:var(--amber);animation:blink 1s ease-in-out infinite}
.sync[data-s="error"] i,.sync[data-s="local"] i{background:var(--red)}
@keyframes blink{50%{opacity:.2}}
/* page basics (standalone) */
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* settings card */
.settings{border-radius:22px;padding:16px 18px;margin-top:22px}
.settings h3{font-family:var(--f-display);font-size:16px;margin:0 0 10px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.set-row b{font-weight:600;color:var(--muted)}
.set-row b.ok{color:var(--green)}
.set-row a{color:var(--red);font-weight:600;text-decoration:none}
.set-hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.code{font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.12em;color:var(--red);background:var(--red-soft);padding:2px 8px;border-radius:8px}
.set-btn{margin-top:10px;border:0;border-radius:12px;padding:9px 14px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:13px}
@media (max-width:380px){.hero-main{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}#net{display:none}}
</style>
</head>

<script>
const DAY=864e5, KEEP=14, KEY='the-task-glass-v2';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LBL={todo:'ยังไม่เริ่ม',doing:'กำลังทำ',done:'เสร็จแล้ว'};
const NEXT={todo:'doing',doing:'done',done:'todo'};
const TH_DAY=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
const T0=()=>sod(Date.now());
const fmt=d=>{const x=new Date(d);return `${TH_DAY[x.getDay()]} ${x.getDate()} ${TH_MON[x.getMonth()]}`};
const hhmm=d=>new Date(d).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toISO=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};

/* ---- icons ---- */
const IC={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  todo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path class="hand" d="M12 12V7.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  doing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="gear"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></g></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path class="flame" d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 0 2 1 3 2 3-.5-3 .5-6 .5-9z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><g class="bell"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></svg>',
  sun:'<svg class="sky" viewBox="0 0 32 32" fill="none" stroke="#FF8A00" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="6" fill="#FFB020" stroke="none"/><g class="sun-rays"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/></g></svg>',
  moon:'<svg class="sky" viewBox="0 0 32 32"><path class="moon" d="M20 5a11 11 0 1 0 7 19A9 9 0 0 1 20 5z" fill="#FFC94D"/><circle class="twinkle" cx="7" cy="8" r="1.4" fill="#FFC94D"/><circle class="twinkle" cx="26" cy="7" r="1" fill="#FFC94D"/></svg>',
  empty:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><g class="bob"><rect x="14" y="10" width="36" height="44" rx="8" fill="var(--red-soft)"/><path d="M24 26l5 5 11-11"/><path d="M24 40h16"/></g></svg>'
};

/* ---- data ---- */
function sample(){
  const n=Date.now(); let id=1;
  const t=(title,status,p,due,ago,h,note='')=>({id:id++,title,status,p,note,due:due==null?null:sod(n+due*DAY),
    doneAt:ago==null?null:sod(n-ago*DAY)+(h||15)*36e5+((id*13)%60)*6e4});
  return [
    t('PM เครื่อง Light Source ห้องผ่าตัด รพ. 3','doing','high',1,null,0,'นัดหัวหน้าห้อง OR ไว้ 9 โมง'),
    t('อัปเดตตาราง PM ใน Google Sheet','doing','normal',2),
    t('ส่งใบรับซ่อม Endoscope ให้ลูกค้าเซ็น','todo','high',0),
    t('ขอใบเสนอราคาอะไหล่กล้อง','todo','normal',-1),
    t('ทดสอบ IEC 62353 ชุด Camera Control Unit','todo','normal',3),
    t('เตรียมสาย HDMI + Switcher สำหรับ Live Surgery','todo','normal',5),
    t('PM ประจำปี กล้อง Endoscope รพ. 1','todo','normal',9),
    t('งาน Live Surgery สัมมนาแพทย์','todo','high',12,null,0,'ติดตั้งชุด AV ก่อนวันงาน 1 วัน'),
    t('ส่งเครื่องคืนลูกค้าหลังซ่อม','todo','normal',16),
    t('Training ผลิตภัณฑ์ใหม่ให้ทีม','todo','normal',20),
    t('ตอบอีเมลลูกค้าเรื่องคิวซ่อม','done','normal',null,0,10),
    t('ติดตั้ง Insufflator ห้อง OR 2','done','high',null,0,14),
    t('สอนการใช้งานกล้องให้พยาบาลห้อง Endo','done','normal',null,1,13),
    t('Leak Test กล้อง Gastroscope','done','high',null,1,16),
    t('ส่งรายงานซ่อมประจำสัปดาห์','done','normal',null,3,17),
    t('PM Electrosurgical Unit','done','normal',null,4,11),
    t('สรุปผล Training Assessment','done','normal',null,6,15),
    t('เปลี่ยนหลอด Xenon Light Source','done','high',null,8,10),
    t('Calibrate Monitor 4K ห้อง OR 1','done','normal',null,8,14),
    t('ตรวจรับเครื่องใหม่จากคลัง','done','normal',null,11,9),
    t('ประชุมทีม Service ประจำเดือน','done','normal',null,13,10),
  ];
}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* ================= BACKEND: Google Sheet via Apps Script =================
   POST to the Apps Script API (doPost in Code.gs) with the device's saved URL + API_TOKEN.
   Opened anywhere else (file preview): local mode with sample tasks in browser storage. */
const notExpired=t=>!(t.status==='done'&&Date.now()-t.doneAt>KEEP*DAY); // app shows 14 days of history
/* Connection (API URL + token) lives only on this device — never in the repo. */
const CONN_KEY='task-kosin-conn', CACHE_KEY='task-kosin-cache';
let conn=(()=>{try{const c=JSON.parse(store.get(CONN_KEY)||'null');return c&&c.url&&c.token?c:null}catch(e){return null}})();
const HAS_GAS=!!conn;
async function api(action,payload,c){
  c=c||conn;
  const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:c.token,action},payload||{})),redirect:'follow'});
  if(!res.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับ '+res.status);
  let j; try{j=await res.json()}catch(e){throw new Error('ลิงก์ API ไม่ถูกต้อง หรือยังไม่ได้ตั้งสิทธิ์เป็น "ทุกคน"')}
  if(!j.ok)throw new Error(j.error==='unauthorized'?'รหัส API ไม่ถูกต้อง':j.error);
  return j.data;
}
let tasks=[], loaded=false, mode='loading', lastSaved=new Map(), queues=new Map(), pending=0, serverInfo=null;

const toWire=t=>({id:String(t.id),title:t.title,status:t.status,p:t.p,note:t.note||'',due:t.due!=null?toISO(t.due):'',doneAt:t.status==='done'?(t.doneAt||null):null,createdAt:t.createdAt||null});

// Diff current tasks against what the sheet last returned; write only real changes.
function save(){
  if(mode==='local'){store.set(KEY,JSON.stringify(tasks));return}
  if(mode!=='sheet')return;
  const cur=new Map(tasks.map(t=>[String(t.id),JSON.stringify(toWire(t))]));
  for(const [id,j] of cur)if(lastSaved.get(id)!==j){lastSaved.set(id,j);enqueue(id,()=>gas('apiSave',JSON.parse(j)))}
  for(const id of [...lastSaved.keys()])if(!cur.has(id)){lastSaved.delete(id);enqueue(id,()=>gas('apiDelete',id))}
}
// One request at a time per task; one quiet retry.
function enqueue(id,fn){
  pending++;setSync('saving');

  const p=(queues.get(id)||Promise.resolve()).then(run).catch(e=>{
    console.warn('save failed',e); lastSaved.delete(id);
    toast('บันทึกลงชีตไม่สำเร็จ: '+((e&&e.message)||'ลองอีกครั้ง'));
    setSync('error');
  }).finally(()=>{pending--;if(!pending&&$('#sync').dataset.s!=='error')setSync('ok');if(queues.get(id)===p)queues.delete(id)});
  queues.set(id,p);
}

function applyServer(r,fromCache){

  const docs=(r.tasks||[]).map(fromWire);
  lastSaved=new Map(docs.map(t=>[String(t.id),JSON.stringify(toWire(t))]));
  const next=docs.filter(notExpired);

/* ---- confetti ---- */
function burst(el){

  for(let i=0;i<22;i++){
    const s=document.createElement('i'); s.className='spark';
    const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    s.style.cssText=`left:${cx}px;top:${cy}px;background:${colors[i%colors.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-20}px;--rot:${Math.random()*540}deg;${i%3?'':'border-radius:50%;'}`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}

  else{tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:Date.now(),title,note,due,p:fPri,status:fStatus,doneAt:fStatus==='done'?Date.now():null});toast('เพิ่มงานแล้ว')}
  closeSheet(); if(curView==='vHistory')showView('vTasks'); render();
});
$('#fDel').addEventListener('click',e=>{
  const b=e.currentTarget; if(!b.dataset.arm){b.dataset.arm='1';b.textContent='ยืนยันลบ?';return}
  const t=tasks.find(x=>x.id===editing.id)||editing, i=tasks.indexOf(t); if(i>=0)tasks.splice(i,1); closeSheet(); render();
  toast('ลบงานแล้ว',()=>{tasks.splice(i,0,t);render()});
});

/* ---- nav + toast ---- */
let curView='vTasks';
function showView(id){curView=id;$$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===id));$$('.view').forEach(v=>v.classList.toggle('on',v.id===id))}
$$('.tab').forEach(b=>b.addEventListener('click',()=>{showView(b.dataset.v);window.scrollTo({top:0});if(b.dataset.v==='vHistory')renderHistory();if(b.dataset.v==='vCalendar')renderCalendar('in')}));

/* ---- calendar ---- */
const TH_MON_FULL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
let calY=new Date().getFullYear(), calM=new Date().getMonth(), selDay=T0();
const dotColor=t=>t.status==='done'?'var(--green)':t.status==='doing'?'var(--amber)':t.p==='high'?'var(--red)':'var(--muted)';
function renderCalendar(dir){
  const first=new Date(calY,calM,1), t0=T0();
  $('#calTitle').textContent=`${TH_MON_FULL[calM]} ${calY+543}`;
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(calY,calM,1-first.getDay()+i), k=d.getTime();
    if(i===35&&d.getMonth()!==calM)break; // drop an all-next-month last row
    const items=tasks.filter(t=>t.due===k);
    cells+=`<button class="dcell${d.getMonth()!==calM?' out':''}${k===t0?' today':''}${k===selDay?' sel':''}" data-k="${k}" aria-label="${fmt(k)} ${items.length} งาน"><span>${d.getDate()}</span><span class="dots">${items.slice(0,3).map(t=>`<i style="background:${dotColor(t)}"></i>`).join('')}</span></button>`;
  }
  const g=$('#calGrid'); g.innerHTML=cells;
  if(dir){g.classList.remove('slide-l','slide-r');void g.offsetWidth;g.classList.add(dir==='prev'?'slide-r':'slide-l')}
  renderDay();
}
function renderDay(){
  const items=tasks.filter(t=>t.due===selDay).sort((a,b)=>({doing:0,todo:1,done:2}[a.status])-({doing:0,todo:1,done:2}[b.status])||sortOpen(a,b));
  const ago=Math.round((selDay-T0())/DAY);
  const rel=ago===0?'วันนี้':ago===1?'พรุ่งนี้':ago===-1?'เมื่อวาน':ago>0?`อีก ${ago} วัน`:`${-ago} วันก่อน`;
  $('#dayTitle').innerHTML=`${fmt(selDay)} <span>· ${rel} · ${items.length} งาน</span>`;
  $('#addDay').textContent=ago===0?'+ เพิ่มงานวันนี้':'+ เพิ่มงานวันนี้'.replace('วันนี้','วันที่ '+new Date(selDay).getDate());
  $('#dayList').innerHTML=items.length?items.map(cardHTML).join('')
    :`<div class="empty glass">${IC.empty}<b>ยังไม่มีงานในวันนี้</b>กด "+ เพิ่มงาน" เพื่อวางแผนล่วงหน้า</div>`;
}
$('#calGrid').addEventListener('click',e=>{const b=e.target.closest('.dcell');if(!b)return;selDay=+b.dataset.k;
  const d=new Date(selDay); if(d.getMonth()!==calM){const dir=d<new Date(calY,calM,1)?'prev':'next';calY=d.getFullYear();calM=d.getMonth();renderCalendar(dir)}else renderCalendar()});
$('#calPrev').addEventListener('click',()=>{calM--;if(calM<0){calM=11;calY--}renderCalendar('prev')});
$('#calNext').addEventListener('click',()=>{calM++;if(calM>11){calM=0;calY++}renderCalendar('next')});
$('#calToday').addEventListener('click',()=>{const d=new Date();calY=d.getFullYear();calM=d.getMonth();selDay=T0();renderCalendar('in')});
$('#addDay').addEventListener('click',()=>openSheet(null,selDay));
let tt,undoFn=null;
function toast(m,undo){$('#toastMsg').textContent=m;undoFn=undo||null;$('#toastUndo').hidden=!undo;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
$('#toastUndo').addEventListener('click',()=>{undoFn&&undoFn();undoFn=null;$('#toast').classList.remove('show')});

// particle network
(function net(){
  if(REDUCED)return;
  const cv=$('#net'), ctx=cv.getContext('2d'); let W,H,pts=[],dpr=Math.min(2,window.devicePixelRatio||1), mouse={x:-999,y:-999};
  const col=()=>getComputedStyle(document.documentElement).getPropertyValue('--particle').trim()||'224,18,46';
  let rgb=col();
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(70,W*H/16000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.8}))}
  size(); addEventListener('resize',size);
  addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY},{passive:true});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>rgb=col());
  (function frame(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-mouse.x, dy=p.y-mouse.y, dm=Math.hypot(dx,dy);
      if(dm<110){p.x+=dx/dm*.8;p.y+=dy/dm*.8}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`rgba(${rgb},.45)`;ctx.fill();
    }
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<120){ctx.strokeStyle=`rgba(${rgb},${(1-d/120)*.22})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
    }
    requestAnimationFrame(frame);
  })();
})();
